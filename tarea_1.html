








<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tarea_1.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="tarea_1.js"></script>
    <title>-- Listado de Tareas --</title>
</head>
<body>
    <div id="contenedor">
       
        <div id="titulo">
            <h1>Listado de Tareas</h1>
        </div>
        <div id="entrada_texto">

            <label for="actividad">Tipo de Actividad:</label>

            <select id="actividad" name="actividad">
                <option value="">-- Opciones --</option>
                
            </select>

            <label for="prioridad">Prioridad:</label>

            <select id="prioridad" name="prioridad">
                <option value="">-- Opciones --</option>
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja" >Baja</option>
            </select>

            <input type="text" id="text_agre"> 
            <input type="hidden" id="hidText" value="">
            <button id="agregar" class="control">Agregar Tarea</button>
            
            <select id="export" class="control" name="Descarga">
                <option value="todo">Reporte General</option>
                <option value="prioridad_vs_estado">Reporte prioridad vs estado</option>
            </select>
            <button id="descargar" >Descargar</button>
        </div> 
        <div id="items">

        </div>

    </div>
    
</body>
</html>
