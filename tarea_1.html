








<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tarea_1.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="tarea_1.js"></script>
    <title>-- Listado de Tareas --</title>
</head>
<body>
    <div id="contenedor">
       
        <div id="titulo">
            <h1>Listado de Tareas</h1>
        </div>
        <div id="entrada_texto">

            <label for="actividad">Tipo de Actividad:</label>

            <select id="actividad" name="actividad">
                <option value="">-- Opciones --</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Estudio">Estudio</option>
                <option value="Hogar" >Hogar</option>
            </select>

            <label for="prioridad">Prioridad:</label>

            <select id="prioridad" name="prioridad">
                <option value="">-- Opciones --</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja" >Baja</option>
            </select>

            <input type="text" id="text_agre"> 
            <input type="hidden" id="hidText" value="">
            <button id="agregar" class="control">Agregar Tarea</button>
        </div> 
        <div id="items">

        </div>

    </div>
    
</body>
</html>
